<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Web制作手順書シート — 受注〜納品 完全フロー</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#08080f;--bg1:#0f0f1e;--bg2:#14142a;--bg3:#1a1a35;--bg4:#20203f;
  --acc:#6c63ff;--acc2:#ff6b9d;--acc3:#00d4aa;--acc4:#ffd93d;--acc5:#ff922b;
  --txt:#e4e4f4;--dim:#8888aa;--bdr:#222244;
  --ok:#4ade80;--warn:#facc15;--err:#f87171;
  --ai:#7c3aed;--ai-bg:rgba(124,58,237,.12);--ai-bdr:rgba(124,58,237,.35);
  --tip:#0369a1;--tip-bg:rgba(3,105,161,.1);
}
body{background:var(--bg0);color:var(--txt);
  font-family:-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif;
  font-size:13px;line-height:1.6;min-height:100vh}

/* ── Header ── */
.hd{background:linear-gradient(135deg,#06061a,#10104a);
  padding:16px 24px;border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.hd-icon{font-size:28px}
.hd-info{flex:1}
.hd-title{font-size:18px;font-weight:800;letter-spacing:.3px}
.hd-sub{font-size:11px;color:var(--dim);margin-top:2px}
.hd-badges{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.badge{padding:3px 12px;border-radius:100px;font-size:10px;font-weight:700}
.badge-acc{background:var(--acc);color:#fff}
.badge-ok{background:var(--ok);color:#000}
.badge-warn{background:var(--warn);color:#000}

/* ── Overall Progress ── */
.overall{background:var(--bg2);padding:10px 24px;border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:16px}
.ov-label{font-size:11px;color:var(--dim);white-space:nowrap}
.ov-bar{flex:1;height:8px;background:var(--bg4);border-radius:100px;overflow:hidden}
.ov-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc3));
  border-radius:100px;transition:width .4s ease}
.ov-pct{font-size:13px;font-weight:700;color:var(--acc3);font-family:monospace;
  white-space:nowrap;min-width:48px;text-align:right}
.ov-count{font-size:11px;color:var(--dim);white-space:nowrap}
.ov-reset{background:none;border:1px solid var(--bdr);color:var(--dim);
  padding:3px 10px;border-radius:6px;cursor:pointer;font-size:10px;font-family:inherit;
  transition:all .15s}
.ov-reset:hover{border-color:var(--err);color:var(--err)}

/* ── Layout ── */
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 96px)}

/* ── Sidebar ── */
.sidebar{background:var(--bg1);border-right:1px solid var(--bdr);
  position:sticky;top:96px;height:calc(100vh - 96px);overflow-y:auto;padding:14px 0}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.ph-item{padding:9px 16px;cursor:pointer;transition:background .15s;
  display:flex;align-items:center;gap:10px;border-left:3px solid transparent}
.ph-item:hover{background:var(--bg3)}
.ph-item.active{background:var(--bg3);border-left-color:var(--acc)}
.ph-num{width:22px;height:22px;border-radius:50%;background:var(--bg4);
  display:flex;align-items:center;justify-content:center;font-size:10px;
  font-weight:700;flex-shrink:0;color:var(--dim)}
.ph-item.active .ph-num{background:var(--acc);color:#fff}
.ph-item.done .ph-num{background:var(--ok);color:#000}
.ph-info{flex:1;min-width:0}
.ph-name{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-prog{font-size:9px;color:var(--dim);margin-top:2px}
.ph-mini-bar{width:100%;height:3px;background:var(--bg4);border-radius:100px;margin-top:4px;overflow:hidden}
.ph-mini-fill{height:100%;background:var(--acc3);border-radius:100px;transition:width .3s}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--bdr);margin-top:8px}
.sf-label{font-size:10px;color:var(--dim);margin-bottom:4px}
.sf-tip{font-size:10px;color:var(--acc4);line-height:1.5}

/* ── Main ── */
.main{background:var(--bg0);overflow-y:auto;padding:0}
.phase-panel{display:none;padding:24px}
.phase-panel.active{display:block}

/* Phase header */
.ph-hd{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px;
  padding-bottom:16px;border-bottom:1px solid var(--bdr)}
.ph-hd-num{width:44px;height:44px;border-radius:12px;background:var(--acc);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  font-weight:800;color:#fff;flex-shrink:0}
.ph-hd-info{flex:1}
.ph-hd-title{font-size:18px;font-weight:800;margin-bottom:4px}
.ph-hd-desc{font-size:12px;color:var(--dim)}
.ph-hd-meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.meta-tag{padding:2px 9px;border-radius:100px;font-size:10px;font-weight:600;
  border:1px solid var(--bdr);color:var(--dim)}
.meta-tag.time{border-color:var(--acc);color:var(--acc)}
.meta-tag.tasks{border-color:var(--acc3);color:var(--acc3)}
.ph-hd-prog{text-align:right;flex-shrink:0}
.ph-pct-big{font-size:28px;font-weight:800;color:var(--acc3);line-height:1;font-family:monospace}
.ph-pct-label{font-size:10px;color:var(--dim)}

/* Section */
.section{margin-bottom:20px}
.section-title{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  color:var(--dim);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.section-title::after{content:'';flex:1;height:1px;background:var(--bdr)}

/* Task list */
.task-list{display:flex;flex-direction:column;gap:4px}
.task{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;
  border-radius:9px;border:1.5px solid var(--bdr);background:var(--bg2);
  cursor:pointer;transition:all .15s;user-select:none}
.task:hover{border-color:var(--acc);background:var(--bg3)}
.task.done{background:rgba(74,222,128,.06);border-color:rgba(74,222,128,.25)}
.task.done .task-text{text-decoration:line-through;color:var(--dim)}
.task-cb{width:18px;height:18px;border-radius:5px;border:2px solid var(--bdr);
  flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;
  transition:all .15s;background:var(--bg4)}
.task.done .task-cb{background:var(--ok);border-color:var(--ok)}
.task-cb-icon{font-size:11px;display:none}
.task.done .task-cb-icon{display:block}
.task-body{flex:1;min-width:0}
.task-text{font-size:12px;line-height:1.5}
.task-sub{font-size:10px;color:var(--dim);margin-top:2px;line-height:1.5}
.task-tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.ttag{padding:1px 7px;border-radius:100px;font-size:9px;font-weight:600}
.ttag-ai{background:rgba(124,58,237,.2);color:#c084fc;border:1px solid rgba(124,58,237,.3)}
.ttag-imp{background:rgba(255,147,43,.15);color:var(--acc5);border:1px solid rgba(255,147,43,.3)}
.ttag-tmpl{background:rgba(0,212,170,.1);color:var(--acc3);border:1px solid rgba(0,212,170,.3)}
.ttag-note{background:rgba(136,136,170,.1);color:var(--dim);border:1px solid rgba(136,136,170,.2)}

/* AI Tip box */
.ai-box{background:var(--ai-bg);border:1.5px solid var(--ai-bdr);border-radius:10px;
  padding:14px 16px;margin-bottom:16px}
.ai-box-title{font-size:11px;font-weight:700;color:#c084fc;margin-bottom:10px;
  display:flex;align-items:center;gap:6px}
.ai-tip{display:flex;gap:9px;margin-bottom:8px;font-size:11px;line-height:1.55;color:var(--txt)}
.ai-tip:last-child{margin-bottom:0}
.ai-tip-icon{flex-shrink:0;width:18px;height:18px;background:rgba(124,58,237,.3);
  border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px}
.ai-tip b{color:#e879f9}

/* Template box */
.tmpl-box{border:1.5px solid var(--bdr);border-radius:10px;overflow:hidden;margin-bottom:12px}
.tmpl-hd{background:var(--bg3);padding:9px 14px;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;user-select:none}
.tmpl-hd:hover{background:var(--bg4)}
.tmpl-title{font-size:11px;font-weight:700;display:flex;align-items:center;gap:7px}
.tmpl-arrow{font-size:10px;color:var(--dim);transition:transform .2s}
.tmpl-body{display:none;padding:14px;background:var(--bg0)}
.tmpl-body.open{display:block}
.tmpl-content{font-size:11px;line-height:1.7;color:var(--txt);white-space:pre-wrap;
  background:var(--bg2);border:1px solid var(--bdr);border-radius:7px;
  padding:12px 14px;font-family:monospace;margin-bottom:8px;max-height:280px;overflow-y:auto}
.tmpl-copy{background:var(--acc);color:#fff;border:none;padding:6px 16px;
  border-radius:7px;cursor:pointer;font-size:11px;font-weight:700;font-family:inherit;
  transition:opacity .15s}
.tmpl-copy:hover{opacity:.85}
.tmpl-copy.copied{background:var(--ok);color:#000}

/* Info / warning box */
.info-box{display:flex;gap:10px;padding:12px 14px;border-radius:9px;margin-bottom:14px;
  font-size:11px;line-height:1.55}
.info-box.warn{background:rgba(250,204,21,.08);border:1px solid rgba(250,204,21,.3);color:var(--txt)}
.info-box.ok{background:rgba(74,222,128,.07);border:1px solid rgba(74,222,128,.25);color:var(--txt)}
.info-box.tip{background:rgba(3,105,161,.1);border:1px solid rgba(3,105,161,.3);color:var(--txt)}
.info-icon{font-size:16px;flex-shrink:0}
.info-box b{color:var(--acc4)}

/* Pricing table */
.price-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:16px}
.price-table th{background:var(--bg3);padding:8px 12px;text-align:left;font-size:10px;
  font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);
  border-bottom:1px solid var(--bdr)}
.price-table td{padding:9px 12px;border-bottom:1px solid var(--bdr);vertical-align:middle}
.price-table tr:last-child td{border-bottom:none}
.price-table tr:hover td{background:var(--bg2)}
.price-range{font-weight:700;color:var(--acc4);font-family:monospace}

/* Checklist summary */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.summary-card{background:var(--bg2);border:1.5px solid var(--bdr);border-radius:10px;
  padding:12px 14px;text-align:center}
.sc-num{font-size:24px;font-weight:800;font-family:monospace;line-height:1}
.sc-label{font-size:10px;color:var(--dim);margin-top:4px}
.sc-bar{width:100%;height:4px;background:var(--bg4);border-radius:100px;
  margin-top:8px;overflow:hidden}
.sc-fill{height:100%;border-radius:100px;transition:width .4s}

/* Print */
@media print{
  .sidebar,.overall .ov-reset,.tmpl-copy,.hd-badges{display:none}
  .layout{grid-template-columns:1fr}
  .phase-panel{display:block!important;page-break-before:always}
  .phase-panel:first-child{page-break-before:auto}
  body{background:#fff;color:#000}
  .hd{background:#fff;color:#000;border-bottom:2px solid #000}
  .task,.ai-box,.tmpl-box{border-color:#ccc}
}

/* Responsive */
@media(max-width:680px){
  .layout{grid-template-columns:1fr}
  .sidebar{display:none}
}
</style>
</head>
<body>

<div class="hd">
  <div class="hd-icon">🌐</div>
  <div class="hd-info">

  </div>
  <div class="hd-badges">
    <span class="badge badge-acc">for Webクリエイター</span>
    <button onclick="window.print()" style="background:var(--bg3);border:1px solid var(--bdr);color:var(--dim);padding:4px 12px;border-radius:7px;cursor:pointer;font-size:10px;font-family:inherit">🖨 印刷</button>
  </div>
</div>

<div class="overall">
  <span class="ov-label">全体進捗</span>
  <div class="ov-bar"><div class="ov-fill" id="ov-fill" style="width:0%"></div></div>
  <span class="ov-pct" id="ov-pct">0%</span>

<div class="layout">

<div class="sidebar">

<!-- ═══ MAIN ═══ -->
<div class="main" id="main-content"></div>

</div><!-- /layout -->

  {type:'コーポレートサイト（小）',page:'5〜8ページ',price:'10〜20万円',day:'2〜4週'},
  {type:'コーポレートサイト（中）',page:'10〜20ページ',price:'20〜40万円',day:'4〜8週'},
  {type:'ポートフォリオサイト',page:'5〜10ページ',price:'5〜15万円',day:'1〜3週'},
  {type:'ブログ・メディアサイト',page:'〜WordPress',price:'10〜30万円',day:'3〜6週'},
  {type:'ECサイト（ショップ）',page:'〜Shopify等',price:'30〜80万円',day:'6〜12週'},
  {type:'月次保守プラン',page:'継続',price:'1〜3万円/月',day:'継続'},
];

// ── State ─────────────────────────────────────────────────────────
const STORAGE_KEY='ws_checklist_v1';
function loadState(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch{return{}}}
function saveState(s){localStorage.setItem(STORAGE_KEY,JSON.stringify(s))}

let STATE=loadState();
let currentPhase=PHASES[0].id;

// ── Render ────────────────────────────────────────────────────────
function renderAll(){
  renderSidebar();
  renderContent();
  updateOverall();
}

function renderSidebar(){
  const nav=document.getElementById('ph-nav');
  nav.innerHTML=PHASES.map(ph=>{
    const {done,total}=phaseProgress(ph);
    const pct=total?Math.round(done/total*100):0;
    const isDone=done===total&&total>0;
    return `<div class="ph-item${currentPhase===ph.id?' active':''}${isDone?' done':''}" onclick="switchPhase('${ph.id}')">
      <div class="ph-num">${isDone?'✓':ph.num}</div>
      <div class="ph-info">
        <div class="ph-name">${ph.icon} ${ph.name}</div>
        <div class="ph-prog">${done}/${total} タスク完了</div>
        <div class="ph-mini-bar"><div class="ph-mini-fill" style="width:${pct}%"></div></div>
      </div>
    </div>`;
  }).join('');
}

function phaseProgress(ph){
  const done=ph.tasks.filter(t=>STATE[t.id]).length;
  return{done,total:ph.tasks.length};
}

function renderContent(){
  const mc=document.getElementById('main-content');
  mc.innerHTML=PHASES.map(ph=>renderPhase(ph)).join('')+renderPricingPanel();
  // bind template toggles
  document.querySelectorAll('.tmpl-hd').forEach(h=>{
    h.addEventListener('click',()=>{
      const body=h.nextElementSibling;
      const arrow=h.querySelector('.tmpl-arrow');
      body.classList.toggle('open');
      arrow.style.transform=body.classList.contains('open')?'rotate(180deg)':'';
    });
  });
  // bind copy buttons
  document.querySelectorAll('.tmpl-copy').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const pre=btn.previousElementSibling;
      navigator.clipboard.writeText(pre.textContent).then(()=>{
        btn.textContent='✓ コピーしました';btn.classList.add('copied');
        setTimeout(()=>{btn.textContent='📋 コピー';btn.classList.remove('copied')},2000);
      });
    });
  });
}

function renderPhase(ph){
  const {done,total}=phaseProgress(ph);
  const pct=total?Math.round(done/total*100):0;

  const aiHtml=ph.aiBox?`<div class="ai-box">
    <div class="ai-box-title">${ph.aiBox.title}</div>
    ${ph.aiBox.tips.map(t=>`<div class="ai-tip">
      <div class="ai-tip-icon">${t.icon}</div>
      <span>${t.text}</span>
    </div>`).join('')}
  </div>`:'';

  const tmplHtml=ph.templates.length?ph.templates.map(t=>`
    <div class="tmpl-box">
      <div class="tmpl-hd">
        <span class="tmpl-title">${t.title}</span>
        <span class="tmpl-arrow">▼</span>
      </div>
      <div class="tmpl-body">
        <div class="tmpl-content">${escHtml(t.content)}</div>
        <button class="tmpl-copy">📋 コピー</button>
      </div>
    </div>`).join(''):'';

  const taskHtml=ph.tasks.map(t=>{
    const isDone=!!STATE[t.id];
    const tags=(t.tags||[]).map(tg=>({
      ai:`<span class="ttag ttag-ai">🤖 AI活用</span>`,
      imp:`<span class="ttag ttag-imp">⚡ 重要</span>`,
      tmpl:`<span class="ttag ttag-tmpl">📄 テンプレあり</span>`,
      note:`<span class="ttag ttag-note">📝 注意</span>`,
    }[tg]||'')).join('');
    return `<div class="task${isDone?' done':''}" onclick="toggleTask('${t.id}')">
      <div class="task-cb"><span class="task-cb-icon">✓</span></div>
      <div class="task-body">
        <div class="task-text">${t.text}</div>
        ${t.sub?`<div class="task-sub">${t.sub}</div>`:''}
        ${tags?`<div class="task-tags">${tags}</div>`:''}
      </div>
    </div>`;
  }).join('');

  return `<div class="phase-panel${currentPhase===ph.id?' active':''}" id="${ph.id}">
    <div class="ph-hd">
      <div class="ph-hd-num" style="background:${ph.color}">${ph.num}</div>
      <div class="ph-hd-info">
        <div class="ph-hd-title">${ph.icon} ${ph.name}</div>
        <div class="ph-hd-desc">${ph.desc}</div>
        <div class="ph-hd-meta">
          <span class="meta-tag time">⏱ 目安: ${ph.time}</span>
          <span class="meta-tag tasks">✅ ${total}タスク</span>
        </div>
      </div>
      <div class="ph-hd-prog">
        <div class="ph-pct-big" id="${ph.id}-pct">${pct}%</div>
        <div class="ph-pct-label">${done} / ${total}</div>
      </div>
    </div>
    ${aiHtml}
    ${tmplHtml?`<div class="section"><div class="section-title">テンプレート</div>${tmplHtml}</div>`:''}
    <div class="section">
      <div class="section-title">タスクチェックリスト</div>
      <div class="task-list">${taskHtml}</div>
    </div>
  </div>`;
}

function renderPricingPanel(){
  const rows=PRICING.map(p=>`<tr>
    <td>${p.type}</td>
    <td>${p.page}</td>
    <td class="price-range">${p.price}</td>
    <td>${p.day}</td>
  </tr>`).join('');
  return `<div class="phase-panel${currentPhase==='pricing'?' active':''}" id="pricing" style="max-width:760px">
    <div class="ph-hd">
      <div class="ph-hd-num" style="background:#f97316">💴</div>
      <div class="ph-hd-info">
        <div class="ph-hd-title">💴 単価設定・料金参考表</div>
        <div class="ph-hd-desc">Web制作の相場と制作日数の目安。AIツール活用で制作時間を短縮しても単価は下げない。</div>
      </div>
    </div>
    <div class="info-box warn">
      <span class="info-icon">💡</span>
      <span><b>月収100万円の方程式</b>: 月5〜10案件 × 単価10〜20万円 で達成可能。AIで工数削減した分は品質向上か案件数増に充てる。単価を下げる理由にしない。</span>
    </div>
    <div class="info-box ok">
      <span class="info-icon">⚡</span>
      <span><b>修正ルールを契約に明記</b>: 「初稿から2回まで無料、以降1回 5,000円」の一文がスコープクリープ防止に絶大な効果を発揮する。</span>
    </div>
    <div class="section">
      <div class="section-title">制作種別 料金目安</div>
      <table class="price-table">
        <thead><tr><th>制作種別</th><th>規模</th><th>相場単価</th><th>制作日数</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="info-box tip">
      <span class="info-icon">📈</span>
      <span>手順書を提案書に添付して「プロフェッショナルな進行プロセス」をアピールすると<b>採択率と成約単価が上がる</b>。クラウドワークス / ランサーズで差別化ポイントに活用する。</span>
    </div>
  </div>`;
}

// ── Summary Panel ─────────────────────────────────────────────────
function renderSummaryCard(){
  // rendered as part of ph-nav footer
}

// ── Interaction ───────────────────────────────────────────────────
function switchPhase(id){
  currentPhase=id;
  document.querySelectorAll('.phase-panel').forEach(p=>p.classList.toggle('active',p.id===id));
  document.querySelectorAll('.ph-item').forEach(i=>i.classList.toggle('active',i.getAttribute('onclick').includes(`'${id}'`)));
  document.getElementById('main-content').scrollTo(0,0);
  updateSidebarItems();
}

function toggleTask(id){
  STATE[id]=!STATE[id];
  saveState(STATE);
  // Update the clicked task DOM
  const tasks=document.querySelectorAll('.task');
  tasks.forEach(el=>{
    if(el.getAttribute('onclick').includes(`'${id}'`)){
      el.classList.toggle('done',STATE[id]);
    }
  });
  updatePhaseProgress();
  updateOverall();
}

function updatePhaseProgress(){
  PHASES.forEach(ph=>{
    const{done,total}=phaseProgress(ph);
    const pct=total?Math.round(done/total*100):0;
    const pctEl=document.getElementById(ph.id+'-pct');
    if(pctEl)pctEl.textContent=pct+'%';
  });
  updateSidebarItems();
}

function updateSidebarItems(){
  const nav=document.getElementById('ph-nav');
  nav.querySelectorAll('.ph-item').forEach((item,i)=>{
    const ph=PHASES[i];if(!ph)return;
    const{done,total}=phaseProgress(ph);
    const pct=total?Math.round(done/total*100):0;
    const isDone=done===total&&total>0;
    item.querySelector('.ph-prog').textContent=`${done}/${total} タスク完了`;
    item.querySelector('.ph-mini-fill').style.width=pct+'%';
    const num=item.querySelector('.ph-num');
    num.textContent=isDone?'✓':ph.num;
    item.classList.toggle('done',isDone);
  });
}

function updateOverall(){
  const total=PHASES.reduce((s,ph)=>s+ph.tasks.length,0);
  const done=PHASES.reduce((s,ph)=>s+ph.tasks.filter(t=>STATE[t.id]).length,0);
  const pct=Math.round(done/total*100);
  document.getElementById('ov-fill').style.width=pct+'%';
  document.getElementById('ov-pct').textContent=pct+'%';
  document.getElementById('ov-count').textContent=`${done} / ${total} タスク`;
}

function resetAll(){
  if(!confirm('全チェックをリセットしますか？\n進捗はすべてクリアされます。'))return;
  STATE={};saveState(STATE);
  document.querySelectorAll('.task').forEach(el=>el.classList.remove('done'));
  updatePhaseProgress();updateOverall();
}

function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Add pricing nav item
function addPricingNav(){
  const nav=document.getElementById('ph-nav');
  const div=document.createElement('div');
  div.className='ph-item'+( currentPhase==='pricing'?' active':'');
  div.setAttribute('onclick',"switchPhase('pricing')");
  div.innerHTML=`<div class="ph-num">💴</div><div class="ph-info"><div class="ph-name">単価・料金参考表</div><div class="ph-prog">相場一覧</div></div>`;
  nav.appendChild(div);
}

// Init
renderAll();
addPricingNav();
updatePhaseProgress();
</script>
